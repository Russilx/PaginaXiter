<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="robots" content="noindex">
<meta name="description" content="Panel de administración">
<meta name="theme-color" content="#080505">
<meta name="robots" content="noindex">
<meta property="og:type" content="website"><meta property="og:title" content="Admin · Tienda de diamantes"><meta property="og:description" content="Panel de administración"><meta property="og:image" content="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net"><link rel="preconnect" href="https://udmumufzdkvnmmeicxup.supabase.co">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="stylesheet" href="assets/styles.css">
<style>.ix{background:#0006;border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:10px}.ix-h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start}.ix-h>div:first-child b{display:block;font-size:1.02rem}.ix-h small{display:block;color:var(--muted);font-size:.8rem;margin-top:2px}.ix-bs{display:flex;gap:6px;flex-wrap:wrap}.ix-b{font-size:.72rem;font-weight:700;border:1px solid var(--line2);border-radius:999px;padding:3px 10px;color:var(--muted);white-space:nowrap}.ix-b.ok{color:var(--wa);border-color:#3ddc9755}.ix-b.warn{color:var(--gold);border-color:#ffc83d55}.ix-b.bad{color:var(--err);border-color:#ff6b6b55}.ix-j{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.ix-p{background:var(--input);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:.85rem}.ix-p i{font-style:normal;color:var(--muted);margin-left:6px;font-variant-numeric:tabular-nums}.ix-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}.ix-c{background:var(--input);border:1px solid var(--line);border-radius:10px;padding:9px 12px}.ix-c small{display:block;color:var(--muted);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;margin-bottom:3px}.ix-c b{font-weight:600;font-size:.92rem;word-break:break-word}.ix-a{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.ix-a .btn{margin:0}.tsh{margin:22px 0 10px;padding-top:14px;border-top:1px solid var(--line2);font-size:.95rem;letter-spacing:.06em;text-transform:uppercase}.tsec{background:var(--card);border:1px dashed var(--line2);border-radius:12px;padding:12px;margin-bottom:6px}.tpre{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.tprev{margin-top:12px;padding:12px 14px;border-radius:12px;background:#e1060018;border:1px solid #e1060055;font-size:.92rem;line-height:1.6}.tprev:empty{display:none}.tc .tn2-chip b{text-transform:none}.tc .tn2-chips{margin-bottom:12px}.btn.danger{background:transparent;color:#ff8a8a;border:1.5px solid #e1060077;box-shadow:none}.btn.danger:hover{background:#e1060022;filter:none}.btn.danger:active{transform:none;box-shadow:none}</style>
<link rel="stylesheet" href="assets/tema.css">
</head>
<body>
<div class="wrap">
  <header><a class="back" href="index.html">‹ Volver al inicio</a><div id="acct"></div></header>
  <div class="page-title"><h1>Panel de administrador</h1></div>
  <div id="panel" style="margin-top:26px"><p style="color:var(--muted)">Cargando…</p></div>
</div>
<div id="ov"><div class="modal" id="modal"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
<script src="assets/app.js"></script>
<script>
  const panel = document.getElementById("panel");
  Auth.listo.then(()=>{
    const u = Auth.actual();
    if(!u) return location.replace("cuenta.html?volver=admin.html");
    if(!u.es_admin){ panel.innerHTML = '<p>No tenés acceso a esta página.</p>'; return; }
    cargar();
  });
  const quien = p => `${esc(p?.nombre)} <span style="color:var(--muted)">(${esc(p?.email)})</span>`;
  const fecha = t => new Date(t).toLocaleString("es-AR",{dateStyle:"short",timeStyle:"short"});

  let TAB = "pend", FILT = "todos", OT = new Set(), editId = null, TORN = {}, INSC = {}, PEND = [], ESPERA = {}, DEV = [], INSBYID = {}, KP = {}, CAP = {}, FAL = {}, CFGS = {}, LLAV = {};
  // Monto expresado en la moneda del método que eligió el cliente (y el precio original si es distinto)
  const cobrar = (n, t, metodo) => { const m = (t && t.moneda) || "ARS", o = mon(n, m); if(!metodo) return o; const s = Cobro.texto(Cobro.convertir(n, m, metodo), metodo); return s === o ? s : s + " (precio " + o + ")"; };
  const metCobro = i => /^Binance/.test(i.cobro || "") ? "binance" : /^Mercado/.test(i.cobro || "") ? "mercadopago" : (i.metodo || null);
  const mon = (n,m) => m==="USDT" ? Number(n).toLocaleString("es-AR")+" USDT" : "$"+Number(n).toLocaleString("es-AR");
  const ESTADOS = { proximo:"Próximo", en_curso:"En vivo", finalizado:"Terminado" };
  const estT = t => t.cancelado ? "cancelado" : t.estado;   // estado "visible" (un torneo cancelado va aparte)
  const aLocal = t => { const d = new Date(t); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,16); };

  // Comprobante: foto (se abre con un botón) o, en pagos viejos, el número escrito
  const compRow = x => x.comprobante_ruta
    ? `<div class="row"><span>Comprobante</span><b><button class="btn ghost sm" type="button" data-comp="${esc(x.comprobante_ruta)}">📷 Ver foto</button></b></div><div data-compout></div>`
    : `<div class="row"><span>Comprobante</span><b>${/^foto:/.test(x.referencia || "") ? "📷 foto sin archivo" : esc(x.referencia)}</b></div>`;
  // Premio de un torneo clásico para un puesto (pozo con reparto, o el texto fijo)
  const premioClasico = (t, pos, n) => {
    if(Number(t.pozo_pct) > 0){ const rep = String(t.reparto || "50/30/20").split("/").map(Number); return rep[pos-1] ? mon(Math.floor((Number(t.pozo_base || 0) + n * Number(t.costo || 0) * Number(t.pozo_pct) / 100) * rep[pos-1] / 100), t.moneda) : ""; }
    return [t.premio, t.premio2, t.premio3][pos-1] || "";
  };
  const etiq = i => i.equipo || (i.inscripcion_jugadores[0]||{}).nombre || "Sin nombre";
  const MEDS = ["🥇","🥈","🥉"];
  const ABIERTOS = new Set();
  // Calcula el ranking: más kills = mejor puesto; si empatan comparten puesto
  function armarRanking(t, filas){
    const con = filas.filter(f => f.k !== null && !isNaN(f.k)).sort((a,b) => b.k - a.k);
    let pos = 0, ant = null;
    con.forEach((f,idx) => { if(f.k !== ant){ pos = idx + 1; ant = f.k; } f.pos = pos; });
    const n = (INSC[t.id]||[]).length, rep = String(t.reparto || "50/30/20").split("/").map(Number);
    const pozo = Number(t.pozo_base||0) + n * Number(t.costo||0) * Number(t.pozo_pct||0) / 100;
    const textos = [t.premio, t.premio2, t.premio3];
    con.forEach(f => {
      f.premio = t.tipo === "kills" ? mon(f.k * Number(t.pago_kill||0), t.moneda)
        : (Number(t.pozo_pct) > 0 && rep[f.pos-1] ? mon(Math.floor(pozo * rep[f.pos-1] / 100), t.moneda) : (f.pos <= 3 ? (textos[f.pos-1] || "") : ""));
    });
    return con;
  }
  function rankHtml(t, filas){
    const r = armarRanking(t, filas);
    if(!r.length) return '<p style="color:var(--muted);margin:10px 0 0">Todavía no cargaste kills.</p>';
    const empate = r.length > 1 && r[0].pos === r[1].pos;
    return `<div style="margin-top:12px"><b>Ranking (se arma solo)</b>${r.map(f => `
      <div class="row" style="margin-top:6px"><span>${MEDS[f.pos-1] || f.pos + "º"} ${esc(f.nombre)}</span><b>${f.k} kill${f.k === 1 ? "" : "s"}${f.premio ? " · " + esc(f.premio) : ""}</b></div>`).join("")}
      ${empate ? '<p style="color:#ffb35a;margin:8px 0 0">⚠ Hay empate en el 1º puesto: los dos equipos comparten el puesto. Revisá cómo repartís el premio.</p>' : ""}</div>`;
  }

  // ---- Llaves: cuartos, semifinal y final (eliminatoria directa) ----
  const ERR_LLAVE = { ya_jugado:"Ya hay partidos jugados: no se puede rehacer el sorteo", pocos:"Hacen falta al menos 2 equipos confirmados (con check-in si lo dejaste marcado)", muchos:"Las llaves admiten hasta 16 equipos", siguiente_jugado:"No se puede cambiar: el partido siguiente ya se jugó", incompleto:"Todavía no están definidos los dos equipos", sin_final:"Cargá primero el ganador de la final", sin_tercer:"Cargá primero el ganador del 3er puesto", torneo:"El torneo ya no admite cambios" };
  const errLlave = r => ERR_LLAVE[Object.keys(ERR_LLAVE).find(k => new RegExp(k).test(r.error.message))] || "No se pudo. ¿Ejecutaste llaves.sql?";
  function lSection(t){
    const L = INSC[t.id] || [], P = LLAV[t.id] || [], est = estT(t);
    if(t.cancelado) return "";
    if(!P.length){
      if(!(est === "proximo" || est === "en_curso") || L.length < 2) return "";
      const conf = L.filter(i => i.checkin).length;
      return `<details class="lkbox" data-lk="${t.id}" style="margin-top:10px"><summary style="cursor:pointer;font-weight:700">🥊 Llaves (cuartos, semifinal y final)</summary>
        <p style="color:var(--muted);margin:10px 0">${t.por_fases ? "Este torneo es por fases: las llaves se arman <b>solas</b> cuando cierra el check-in. Este botón es solo por si querés armarlas antes. " : ""}Sortea los cruces con los equipos confirmados (de 2 a 16). Si la cantidad no es potencia de 2, algunos pasan directo de fase. Conviene generarlas cuando cierra el check-in (${conf} / ${L.length} lo hicieron).</p>
        <label style="display:flex;gap:8px;align-items:center;margin:8px 0;text-transform:none;letter-spacing:0;font-weight:400"><input type="checkbox" data-lk-ck checked style="width:auto"> Solo equipos con check-in hecho</label>
        <label style="display:flex;gap:8px;align-items:center;margin:8px 0 12px;text-transform:none;letter-spacing:0;font-weight:400"><input type="checkbox" data-lk-3 style="width:auto"> Incluir partido por el 3er puesto</label>
        <button class="btn" type="button" data-lg="${t.id}">🎲 Generar llaves</button></details>`;
    }
    const fin = est === "finalizado", final = P.find(m => m.fase === "final"), t3 = P.find(m => m.fase === "tercer_puesto");
    const listo = final && final.ganador && (!t3 || t3.ganador), sinJugar = !P.some(m => m.ganador && m.b_id);
    return `<details class="lkbox" data-lk="${t.id}" style="margin-top:10px" open><summary style="cursor:pointer;font-weight:700">🥊 Llaves</summary>
      <p style="color:var(--muted);margin:10px 0">Elegí quién ganó cada partido (el marcador es opcional). El ganador pasa solo a la fase siguiente y se ve en el sitio al instante.</p>
      ${llavesHtml(P, !fin)}
      <div class="acts" style="margin-top:12px">
        ${fin ? '<span style="align-self:center;font-weight:800;color:var(--wa)">✓ Torneo finalizado</span>' : `<button class="btn" type="button" data-lf="${t.id}"${listo ? "" : " disabled"}>Finalizar y publicar ganadores</button>`}
        ${!fin && sinJugar ? `<button class="btn ghost" type="button" data-lr="${t.id}">🔄 Rehacer sorteo</button>` : ""}
      </div>
      ${!fin && !listo ? '<p style="color:var(--muted);margin:8px 0 0;font-size:.85rem">Para finalizar hace falta el ganador de la final' + (t3 ? " y del 3er puesto" : "") + ".</p>" : ""}</details>`;
  }
  function kSection(t){
    const L = INSC[t.id] || [];
    if(!L.length || t.cancelado || t.estado === "proximo") return "";
    const abierto = ABIERTOS.has(t.id) || t.estado === "en_curso";
    return `<details class="kx" data-kx="${t.id}" style="margin-top:10px" ${abierto ? "open" : ""}><summary style="cursor:pointer;font-weight:700">🏆 Resultados y kills</summary>
      <p style="color:var(--muted);margin:10px 0">${t.partidas || 1} partida${(t.partidas || 1) > 1 ? "s" : ""}. Escribí las kills de cada equipo; el puesto y el ganador los calcula el sistema.</p>
      ${L.map(i => { const np = t.partidas || 1, v = KP[i.id] || (np === 1 ? [i.kills] : []), c = (CAP[i.id] || []).length;
        return `<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px"><b style="flex:1;min-width:120px">${esc(etiq(i))} <small style="font-weight:400;color:var(--muted)">${i.checkin ? "✅ check-in" : "⏳ sin check-in"}${FAL[i.usuario] ? " · " + FAL[i.usuario] + " falta(s)" : ""}</small></b>${Array.from({ length: np }, (_, p) => `<input data-ki="${i.id}" data-n="${esc(etiq(i))}" inputmode="numeric" placeholder="${np > 1 ? "P" + (p + 1) : "Kills"}" value="${v[p] ?? ""}" style="max-width:70px"${i.premio_pagado ? " disabled" : ""}>`).join("")}${c ? `<button class="btn ghost sm" type="button" data-cap="${i.id}">📎 ${c}</button>` : ""}<button class="btn ghost sm" type="button" data-nf="${i.id}" data-v="${i.no_presento ? 0 : 1}">${i.no_presento ? "↩ Quitar falta" : "🚫 No se presentó"}</button></div>`; }).join("")}
      <div class="acts" style="margin-top:12px"><button class="btn" type="button" data-gk="${t.id}">Guardar kills</button>${t.estado === "finalizado" ? '<span style="align-self:center;font-weight:800;color:var(--wa)">✓ Torneo finalizado</span>' : `<button class="btn ghost" type="button" data-ft="${t.id}">Finalizar y publicar ganadores</button>`}<button class="btn ghost" type="button" data-img="${t.id}">🖼 Imagen para redes</button></div><div data-capout></div>
      <div data-rk="${t.id}">${rankHtml(t, L.map(i => ({ nombre: etiq(i), k: i.kills })))}</div>
    </details>`;
  }
  const leerKills = box => { const m = new Map(); box.querySelectorAll("input[data-ki]").forEach(x => { const id = +x.dataset.ki, v = x.value.trim(); if(!m.has(id)) m.set(id, { id, nombre: x.dataset.n, vals: [], crudo: [] }); m.get(id).crudo.push(v); m.get(id).vals.push(v === "" ? null : parseInt(v,10)); }); return [...m.values()].map(o => ({ ...o, k: o.vals.every(v => v === null) ? null : o.vals.reduce((a,v) => a + (v || 0), 0) })); };

  const premioTxt = (t, n) => {
    if(t.tipo === "kills") return mon(t.pago_kill || 0, t.moneda) + " por kill";
    if(Number(t.pozo_pct) > 0) return "Pozo " + mon(Math.floor(Number(t.pozo_base || 0) + n * Number(t.costo || 0) * Number(t.pozo_pct) / 100), t.moneda) + " (" + t.pozo_pct + "%)";
    return [t.premio, t.premio2, t.premio3].map((x, i) => x ? MEDS[i] + " " + x : "").filter(Boolean).join(" · ");
  };
  // Una tarjeta por torneo: resumen, avisos, acciones y después las listas
  function tarjeta(t){
    const L = INSC[t.id] || [], pend = PEND.filter(x => x.torneo_id === t.id), est = estT(t);
    const vivo = est === "en_curso", prox = est === "proximo", fin = est === "finalizado", canc = est === "cancelado";
    const ch = t.cierre_horas == null ? 2 : Number(t.cierre_horas), cierre = new Date(t.fecha).getTime() - ch * 3600000;
    const sinFases = t.por_fases && !(LLAV[t.id] || []).length && (prox || vivo) && Date.now() >= new Date(t.fecha).getTime() - 1800000 && L.filter(i => i.checkin).length < 2, sinMin = prox && t.minimo && Date.now() >= cierre && L.length < t.minimo;
    const devs = canc ? L.filter(i => Number(i.monto) > 0 && !i.reembolsado).length : 0;
    const costo = Number(t.costo) > 0 ? mon(t.costo, t.moneda) : "Gratis";
    const chips = [
      ["Modo", t.modo], ["Inscripción", costo], ["Premio", premioTxt(t, L.length)], ["Mapa", t.mapa], ["Formato", t.formato],
      t.partidas > 1 ? ["Partidas", t.partidas] : [],
      t.por_fases ? ["Formato", "Por fases" + (t.tercer_puesto ? " + 3er puesto" : "")] : [],
      prox ? ["Cierra", ch === 0 ? "al inicio" : ch + " h antes"] : [],
      t.minimo ? ["Mínimo", L.length + " / " + t.minimo] : [],
      (ESPERA[t.id] || []).length ? ["Lista de espera", ESPERA[t.id].length] : [],
      (prox || vivo) && L.length ? ["Check-in", L.filter(i => i.checkin).length + " / " + L.length] : []
    ].filter(x => x[1]).map(x => `<span class="tn2-chip"><i>${x[0]}</i><b>${esc(x[1])}</b></span>`).join("");
    const avisos = [
      canc ? `<div class="tn-lock" style="display:block;margin:0 0 10px">❌ Torneo cancelado · ${devs ? "faltan <b>" + devs + "</b> devolución" + (devs > 1 ? "es" : "") + " por hacer" : "no quedan devoluciones pendientes"}</div>` : "",
      sinFases ? `<div class="tn-min" style="color:#ffb35a">⚠ Cerró el check-in y hay menos de 2 equipos con check-in: no se pudieron armar las llaves. Cancelá el torneo para devolver los pagos.</div>` : "",
      sinMin ? `<div class="tn-min" style="color:#ffb35a">⚠ Cerró la inscripción y no se llegó al mínimo (${L.length} / ${t.minimo}). Cancelá el torneo para devolver los pagos.</div>` : "",
      pend.length && !canc ? `<div class="tn-min">⏳ <b>${pend.length}</b> pago${pend.length > 1 ? "s" : ""} por aprobar <button class="btn ghost sm" type="button" data-gopend style="margin-left:8px">Ir a Pendientes</button></div>` : ""
    ].join("");
    const acts = [
      prox ? `<button class="btn${sinMin ? " ghost" : ""}" type="button" data-go="${t.id}">▶ Pasar a En vivo</button>` : "",
      !canc ? `<button class="btn ghost" type="button" data-te="${t.id}">✏️ Editar</button>` : "",
      (prox || vivo) ? `<button class="btn danger" type="button" data-ct="${t.id}">Cancelar torneo</button>` : "",
      !L.length && !pend.length ? `<button class="btn danger" type="button" data-td="${t.id}">🗑 Eliminar</button>` : ""
    ].join("");
    // Tarjeta de cada inscripto: encabezado con estado, jugadores como fichas, datos en grilla y acciones abajo
    const cardI = i => {
      const pagado = Number(i.monto) > 0, metN = i.metodo === "binance" ? "Binance" : "Mercado Pago";
      const badges = [
        pagado ? '<span class="ix-b ok">💸 Pagó</span>' : '<span class="ix-b">🆓 Gratis</span>',
        (prox || vivo) ? (i.checkin ? '<span class="ix-b ok">✅ Check-in</span>' : '<span class="ix-b warn">⏳ Sin check-in</span>') : "",
        FAL[i.usuario] ? `<span class="ix-b bad">⚠ ${FAL[i.usuario]} falta${FAL[i.usuario] > 1 ? "s" : ""}</span>` : "",
        i.premio_pagado ? '<span class="ix-b ok">🏆 Premio pagado</span>' : "",
        canc && pagado ? (i.reembolsado ? '<span class="ix-b ok">↩ Devuelto</span>' : '<span class="ix-b bad">↩ Falta devolver</span>') : ""
      ].join("");
      const premioC = t.tipo !== "kills" && fin && i.puesto && i.puesto <= 3 ? premioClasico(t, i.puesto, L.length) : "";
      const celdas = [
        pagado ? ["Pagó", cobrar(i.monto, t, i.metodo) + " · " + metN] : [],
        pagado ? ["Comprobante", i.comprobante_ruta ? `<button class="btn ghost sm" type="button" data-comp="${esc(i.comprobante_ruta)}">📷 Ver foto</button>` : (/^foto:/.test(i.referencia || "") ? "📷 sin archivo" : esc(i.referencia || "—"))] : [],
        (t.tipo === "kills" || i.cobro) ? ["Cobra en", esc(i.cobro || "—")] : [],
        !canc && i.kills != null ? ["Resultado", (i.puesto ? i.puesto + "º" : "—") + " · " + i.kills + " kills"] : [],
        !canc && t.tipo === "kills" && i.kills != null ? ["Debés pagar", cobrar(i.premio_kills, t, metCobro(i))] : [],
        premioC ? ["Debés pagar (" + i.puesto + "º)", esc(premioC)] : []
      ].filter(x => x.length).map(x => `<div class="ix-c"><small>${x[0]}</small><b>${x[1]}</b></div>`).join("");
      const botones = [
        canc && pagado && !i.reembolsado ? `<button class="btn sm" type="button" data-rb="${i.id}">Marcar devuelto</button>` : "",
        !canc && t.tipo === "kills" && i.kills != null && !i.premio_pagado ? `<button class="btn ghost sm" type="button" data-pp="${i.id}">Marcar premio pagado</button>` : "",
        premioC && !i.premio_pagado ? `<button class="btn ghost sm" type="button" data-ppc="${i.id}">Marcar premio pagado</button>` : "",
        (prox || vivo) ? `<button class="btn danger sm" type="button" data-ci="${i.id}">Quitar inscripción</button>` : ""
      ].join("");
      return `<div class="ix">
        <div class="ix-h"><div><b>${esc(etiq(i))}</b><small>${quien(i.perfiles)}</small></div><div class="ix-bs">${badges}</div></div>
        <div class="ix-j">${(i.inscripcion_jugadores || []).map(j => `<span class="ix-p">${esc(j.nombre)} <i>${esc(j.id_jugador)}</i></span>`).join("")}</div>
        ${celdas ? `<div class="ix-g">${celdas}</div>` : ""}
        <div data-compout></div>
        ${botones ? `<div class="ix-a">${botones}</div>` : ""}
      </div>`;
    };
    const lista = L.length ? `<details style="margin-top:10px"><summary style="cursor:pointer;font-weight:700">👥 Inscriptos (${L.length})</summary>${L.map(cardI).join("")}
        <button class="btn ghost sm" type="button" data-cp="${t.id}" style="margin-top:12px">Copiar lista (nombre + ID)</button></details>` : "";

    return `<details class="step tc" data-tc="${t.id}" data-est="${est}" ${OT.has(t.id) ? "open" : ""}>

        p_minimo: minimo, p_pozo_pct: pozoPct, p_pozo_base: pbase, p_reparto: reparto
      });
      sv.disabled = false;
      if(r.error) return toast("No se pudo guardar");
      let nid = editId || (/^\d+$/.test(String(r.data)) ? +r.data : null);
      if(!nid){ const q = await sb.from("torneos").select("id").eq("titulo", titulo).eq("fecha", iso).order("id",{ ascending:false }).limit(1); nid = q.data && q.data[0] && q.data[0].id; }
      if(nid){ const fz = await sb.rpc("set_fases_torneo",{ p_id: nid, p_activo: $("t_tipo").value === "fases", p_tercer: $("t_3p").checked }); if(fz.error) toast("Torneo guardado, pero no se pudo marcar 'por fases'. ¿Ejecutaste llaves.sql?"); }
      if(nid){ const x = await sb.rpc("guardar_extras_torneo",{ p_id: nid, p_partidas: par, p_link: lk }); if(x.error) toast("Torneo guardado, pero no se pudieron guardar partidas/link"); else toast(editId ? "Torneo actualizado" : "🚀 Torneo publicado"); }
      else toast(editId ? "Torneo actualizado" : "🚀 Torneo publicado");
      cargar(); return;
    }
    if(e.target.closest("#tcancel")){ cargar(); return; }
    const go = e.target.closest("button[data-go]");
    if(go){
      const t = TORN[go.dataset.go]; if(!t) return;
      if(!confirm("¿Pasar «" + t.titulo + "» a En vivo? Se cierran las inscripciones y el check-in, y se habilita la carga de kills.")) return;
      go.disabled = true;
      const r = await sb.rpc("guardar_torneo", paramsTorneo(t, "en_curso"));
      toast(r.error ? "No se pudo cambiar el estado" : "Torneo en vivo 🔴");
      OT.add(t.id); cargar(); return;
    }
    const ed = e.target.closest("button[data-te]");
    if(ed){
      const t = TORN[ed.dataset.te]; if(!t) return;
      editId = t.id; $("tcreate").open = true; TAB = "torn"; mostrarTab();
      llenar(t); bloquear(t);
      $("w_estado").style.display = t.estado === "finalizado" ? "none" : ""; $("w_copia").style.display = "none";
      $("thead").textContent = "Editar torneo"; $("tsave").textContent = "Guardar cambios"; $("tcancel").style.display = "";
      $("tform").scrollIntoView({ behavior:"smooth", block:"center" });
      return;
    }
    const ct = e.target.closest("button[data-ct]");
    if(ct){
      const tt = TORN[ct.dataset.ct], pag = tt ? (INSC[tt.id] || []).filter(i => Number(i.monto) > 0).length : 0;
      if(!confirm("¿Cancelar el torneo" + (tt ? " «" + tt.titulo + "»" : "") + "? " + (pag ? "Hay " + pag + " inscripción" + (pag > 1 ? "es pagas" : " paga") + ": van a la lista de devoluciones y tenés que devolver los pagos a mano. " : "Nadie pagó, no hay nada que devolver. ") + "No se puede deshacer.")) return;
      const r = await sb.rpc("cancelar_torneo",{ p_id: +ct.dataset.ct });
      toast(r.error ? "No se pudo cancelar" : "Torneo cancelado");
      cargar(); return;
    }
    const rb = e.target.closest("button[data-rb]");
    if(rb){
      const r = await sb.rpc("marcar_reembolso",{ p_id: +rb.dataset.rb });
      toast(r.error ? "No se pudo marcar" : "Devolución registrada");
      cargar(); return;
    }
    const ppc = e.target.closest("button[data-ppc]");
    if(ppc){
      if(!confirm("¿Ya le pagaste el premio a este jugador? Se marca como pagado y no se puede cambiar.")) return;
      const r = await sb.rpc("marcar_premio_clasico_pagado",{ p_id: +ppc.dataset.ppc });
      toast(r.error ? "No se pudo marcar" : "Premio marcado como pagado");
      cargar(); return;
    }
    const dv = e.target.closest("button[data-dv]");
    if(dv){
      const box = dv.closest(".step"), ok = dv.dataset.dv === "ok";
      if(!confirm(ok ? "¿Ya devolviste el dinero? Se marca como devuelto y se quita la inscripción (se libera el cupo)." : "¿Rechazar el pedido de devolución?")) return;
      if(ok){ const c = await sb.rpc("cancelar_inscripcion",{ p_id: +box.dataset.inscId }); if(c.error){ toast("No se pudo quitar la inscripción"); return; } }
      const r = await sb.rpc("resolver_devolucion",{ p_id: +box.dataset.dev, p_aprobar: ok });
      toast(r.error ? "No se pudo resolver el pedido" : "Listo");
      cargar(); return;
    }
    const pp = e.target.closest("button[data-pp]");
    if(pp){
      if(!confirm("¿Ya le pagaste el premio a este jugador? Se marca como pagado y no se puede cambiar.")) return;
      const r = await sb.rpc("marcar_premio_pagado",{ p_id: +pp.dataset.pp });
      toast(r.error ? "No se pudo marcar" : "Premio marcado como pagado");
      cargar(); return;
    }
    const ra = e.target.closest("button[data-ra]");
    if(ra){
      const ok = ra.dataset.ra === "ok";
      if(!ok && !confirm("¿Rechazar esta inscripción? Se libera el cupo y los IDs.")) return;
      const r = await sb.rpc("resolver_inscripcion",{ p_id: +ra.closest(".step").dataset.insc, p_aprobar: ok });
      toast(r.error ? "No se pudo (¿ya estaba resuelta?)" : "Listo");
      cargar(); return;
    }
    const qi = e.target.closest("button[data-ci]");
    if(qi){
      if(!confirm("¿Quitar esta inscripción? Si ya pagó, devolvele la plata vos (no usa el saldo de la web).")) return;
      const r = await sb.rpc("cancelar_inscripcion",{ p_id: +qi.dataset.ci });
      toast(r.error ? "No se pudo quitar" : "Inscripción quitada");
      cargar(); return;
    }
    const cp = e.target.closest("button[data-cp]");
    if(cp){
      const txt = (INSC[cp.dataset.cp]||[]).map(i=>(i.equipo ? i.equipo+": " : "") + (i.inscripcion_jugadores||[]).map(j=>j.nombre+" ("+j.id_jugador+")").join(", ")).join("\n");
      navigator.clipboard.writeText(txt).then(()=>toast("Lista copiada"), ()=>toast("No se pudo copiar"));
      return;
    }
    const del = e.target.closest("button[data-td]");
    if(del){
      if(!confirm("¿Eliminar este torneo? No se puede deshacer.")) return;
      const r = await sb.rpc("borrar_torneo",{ p_id: +del.dataset.td });
      toast(r.error ? "No se pudo eliminar" : "Torneo eliminado");
      cargar();
    }
  });
  panel.addEventListener("click", async e=>{
    const g = e.target.closest("button[data-pq]"); if(!g) return;
    const precio = parseFloat(g.previousElementSibling.value.replace(",","."));
    if(!(precio>0)) return toast("Escribí un precio válido");
    g.disabled = true;
    const r = await sb.rpc("actualizar_precio",{ p_diamantes:+g.dataset.pq, p_precio:precio });
    g.disabled = false;
    toast(r.error ? "No se pudo guardar" : "Precio guardado");
  });
  panel.addEventListener("click", async e=>{
    const b = e.target.closest("button[data-a]"); if(!b) return;
    const card = b.closest(".step"), ok = b.dataset.a==="ok";
    let r;
    if(card.dataset.dep){
      const monto = parseFloat(card.querySelector("input").value.replace(",","."));
      if(ok && !(monto>0)) return toast("Escribí el saldo a acreditar");
      if(!ok && !confirm("¿Rechazar esta carga?")) return;
      r = await sb.rpc("resolver_deposito",{ p_id:+card.dataset.dep, p_aprobar:ok, p_credito: ok ? monto : null });
    } else {
      if(!ok && !confirm("¿Rechazar el pedido y devolver el saldo al cliente?")) return;
      r = await sb.rpc("resolver_pedido",{ p_id:+card.dataset.ped, p_ok:ok });
    }
    toast(r.error ? "No se pudo (¿ya estaba resuelto?)" : "Listo");
    cargar();
  });
</script>
</body>
</html>
