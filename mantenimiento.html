<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="logo.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>En mantenimiento — XITERKING STORE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=10">
<style>
  .mant-wrap{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px 20px;
    text-align:center;
  }
  .mant-card{
    max-width:480px;
  }
  .mant-icon{
    font-size:48px;
    margin-bottom:18px;
    display:inline-block;
    animation:mant-spin 3.5s linear infinite;
  }
  @keyframes mant-spin{
    0%,15%{ transform:rotate(0deg); }
    50%,65%{ transform:rotate(180deg); }
    100%{ transform:rotate(360deg); }
  }
  .mant-titulo{
    font-family:'Anton', sans-serif;
    font-size:clamp(1.8rem, 6vw, 2.6rem);
    letter-spacing:1px;
    color:var(--white);
    margin-bottom:14px;
  }
  .mant-titulo span{ color:var(--red-light); }
  .mant-texto{
    font-size:14.5px;
    color:var(--grey);
    line-height:1.7;
    margin-bottom:28px;
  }
  .mant-botones{
    display:flex;
    gap:12px;
    justify-content:center;
    flex-wrap:wrap;
  }
  @media (prefers-reduced-motion: reduce){
    .mant-icon{ animation:none; }
  }
</style>
</head>
<body>

  <div class="topbar">
    <span class="brandmark">XITERKING</span>
  </div>

  <div class="mant-wrap">
    <div class="card mant-card">
      <span class="mant-icon">🛠️</span>
      <h2 class="mant-titulo">Estamos en <span>mantenimiento</span></h2>
      <p class="mant-texto">
        Le estamos haciendo unos ajustes a la tienda. Volvemos a estar
        disponibles en un rato — gracias por la paciencia.
      </p>
      <div class="mant-botones">
        <a class="btn btn-secondary" id="mant-wsp-btn" target="_blank" rel="noopener">Escribinos por WhatsApp</a>
        <a class="btn btn-secondary" id="mant-discord-btn" target="_blank" rel="noopener">Unirte al Discord</a>
      </div>
    </div>
  </div>

  <script type="module">
    import { WHATSAPP_RECARGAS, DISCORD_INVITE } from './firebase-config.js';
    const texto = encodeURIComponent('Hola! Vi que XITERKING STORE está en mantenimiento, ¿saben cuánto va a tardar?');
    document.getElementById('mant-wsp-btn').href = `https://wa.me/${WHATSAPP_RECARGAS}?text=${texto}`;
    document.getElementById('mant-discord-btn').href = DISCORD_INVITE;
  </script>
  <script src="particles.js" defer></script>
</body>
</html>
